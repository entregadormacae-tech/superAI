<div class="logo-boreal">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00D4FF" stop-opacity="1"/>
                <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#00E5FF" stop-opacity="1"/>
            </linearGradient>
            <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#00D4FF" stop-opacity="1"/>
            </linearGradient>
            <radialGradient id="centroBrilho" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
                <stop offset="30%" stop-color="#00F9FF" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.8"/>
            </radialGradient>
            <filter id="neon">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
        </defs>
        <g filter="url(#neon)">
            <circle cx="50" cy="50" r="42" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.95"/>
            <circle cx="50" cy="50" r="32" stroke="url(#grad2)" stroke-width="1.5" fill="none" opacity="0.9"/>
            <circle cx="50" cy="50" r="22" stroke="url(#grad1)" stroke-width="1.2" fill="none" opacity="0.85"/>
            <circle cx="50" cy="50" r="12" fill="url(#centroBrilho)" opacity="0.35"/>
            <circle cx="50" cy="50" r="5" fill="url(#centroBrilho)" opacity="1"/>
        </g>
    </svg>
</div>
