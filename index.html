<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-IA</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- Tela Inicial -->
    <div id="tela-inicio" class="tela ativa">
        <div class="fundo-animado"></div>
        <div class="container-inicio">
            <div class="logo">🤖</div>
            <h1>Super-IA</h1>
            <p class="subtitulo">Seu assistente inteligente, sempre ao seu lado</p>
            <button class="btn-principal" onclick="abrirChat()">Começar Conversa</button>
        </div>
    </div>

    <!-- Tela de Chat -->
    <div id="tela-chat" class="tela">
        <header class="cabecalho">
            <button class="btn-voltar" onclick="abrirInicio()">←</button>
            <h2>Super-IA</h2>
            <button class="btn-menu" onclick="abrirMenu()">☰</button>
        </header>
        
        <div id="area-mensagens" class="area-mensagens">
            <div class="mensagem ia">
                <div class="avatar">🤖</div>
                <div class="texto">Olá! Eu sou a Super-IA. Como posso ajudar você hoje?</div>
            </div>
        </div>

        <div class="contador-mensagens">
            Mensagens hoje: <span id="contador">50</span>
        </div>

        <div class="caixa-envio">
            <input type="text" id="entrada-mensagem" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
            <button onclick="enviarMensagem()">➤</button>
        </div>
    </div>

    <!-- Menu Lateral -->
    <div id="menu-lateral" class="menu-fechado">
        <div class="conteudo-menu">
            <div class="cabecalho-menu">
                <h3>Seu Plano</h3>
                <button class="btn-fechar" onclick="fecharMenu()">✕</button>
            </div>
            
            <div class="plano ativo">
                <h4>🟢 Grátis</h4>
                <p>50 mensagens/dia • Sem anúncios</p>
            </div>
            
            <div class="plano pro">
                <h4>⭐ Pro</h4>
                <p>500 mensagens/dia • Imagens • Vídeos</p>
                <button class="btn-pro">Em breve</button>
            </div>
        </div>
        <div class="fundo-menu" onclick="fecharMenu()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
