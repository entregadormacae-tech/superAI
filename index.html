<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Nicoluz IA</title>
</head>
<body>
    <div id="menu-lateral" class="menu-overlay escondido">
        <div class="menu-conteudo">
            <div class="cabecalho-menu">
                <h2>Nicoluz IA</h2>
                <button id="fechar-menu" class="btn-fechar">✕</button>
            </div>
            <nav class="itens-menu">
                <button class="item-menu" id="ir-temas"><span class="icone-menu">🎨</span><span>Personalizar Tema</span></button>
                <button class="item-menu" id="ir-vozes"><span class="icone-menu">🎙️</span><span>Voz da IA</span></button>
                <button class="item-menu" id="ir-preferencias"><span class="icone-menu">⚙️</span><span>Preferências de conversa</span></button>
                <div class="divisor-menu"></div>
                <button class="item-menu" id="ir-planos"><span class="icone-menu">⚡</span><span>Ver planos</span></button>
                <button class="item-menu" id="ir-conta"><span class="icone-menu">👤</span><span>Sua conta</span></button>
                <div class="divisor-menu"></div>
                <button class="item-menu sair" id="btn-sair"><span class="icone-menu">🚪</span><span>Sair</span></button>
            </nav>
        </div>
    </div>

    <div class="app-container">
        <div id="tela-inicio" class="tela ativa">
            <div class="tela-centro">
                <div class="logo-boreal">
                    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="globoGrad" cx="35%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.9"/>
                                <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.8"/>
                                <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.7"/>
                                <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.5"/>
                            </radialGradient>
                            <linearGradient id="letraNGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFD700"/>
                                <stop offset="30%" stop-color="#FFA500"/>
                                <stop offset="60%" stop-color="#9932EB"/>
                                <stop offset="100%" stop-color="#4B00E0"/>
                            </linearGradient>
                            <filter id="brilhoSuave">
                                <feGaussianBlur stdDeviation="2" result="blur"/>
                                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                            </filter>
                            <linearGradient id="coroaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFE066"/>
                                <stop offset="50%" stop-color="#FFB800"/>
                                <stop offset="100%" stop-color="#CC8800"/>
                            </linearGradient>
                        </defs>
                        <circle cx="60" cy="65" r="45" fill="url(#globoGrad)" opacity="0.85"/>
                        <ellipse cx="60" cy="65" rx="55" ry="20" stroke="#FFD700" stroke-width="1.2" fill="none" opacity="0.4"/>
                        <ellipse cx="60" cy="65" rx="52" ry="38" stroke="#9932EB" stroke-width="0.8" fill="none" opacity="0.3"/>
                        <polygon points="25,30 27,35 32,35 28,39 30,44 25,40 20,44 22,39 17,35 22,35" fill="#FFD700" opacity="0.8"/>
                        <polygon points="95,35 96,38 99,38 97,41 98,45 95,42 92,45 93,41 90,38 93,38" fill="#FFFFFF" opacity="0.7"/>
                        <polygon points="100,75 101,77 103,77 102,80 102,83 100,81 98,83 98,80 96,77 98,77" fill="#FFD700" opacity="0.6"/>
                        <polygon points="20,80 21,82 23,82 22,85 22,88 20,86 18,88 18,85 16,82 18,82" fill="#FFFFFF" opacity="0.5"/>
                        <path d="M40 35 L45 25 L52 33 L60 22 L68 33 L75 25 L80 35 Z" fill="url(#coroaGrad)" filter="url(#brilhoSuave)" opacity="0.95"/>
                        <g filter="url(#brilhoSuave)">
                            <path d="M40 78 L40 38 L50 38 L50 65 L70 38 L80 38 L80 78 L70 78 L70 52 L50 78 L40 78 Z" 
                                  fill="url(#letraNGrad)" opacity="0.95"/>
                        </g>
                    </svg>
                </div>
                <h1 class="titulo-principal">Nicoluz IA</h1>
                <p class="subtitulo">Seu assistente inteligente completo</p>
                <div class="botoes-inicio">
                    <button id="btn-entrar" class="btn btn-principal">Entrar</button>
                    <button id="btn-cadastrar" class="btn btn-secundario">Criar conta</button>
                </div>
                <p class="texto-pequeno" style="margin-top:20px;"><strong>Gratuito</strong> • 50 mensagens/dia • sem anúncios ✅</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
